# Day 4 动手任务：AOF 持久化验证配置
# 用法：docker run -d --name redis-aof -p 6380:6379 -v <本文件目录>:/usr/local/etc/redis redis:7 redis-server /usr/local/etc/redis/redis.conf

# ---- AOF 核心配置 ----
# 开启 AOF（默认 no，仅 RDB）
appendonly yes
# 刷盘策略：每秒 fsync，最多丢 1 秒数据
appendfsync everysec

# ---- AOF Rewrite ----
# AOF 体积比上次 rewrite 增长 100% 时触发
auto-aof-rewrite-percentage 100
# 且至少达到 64MB 才触发（避免小文件频繁重写）
auto-aof-rewrite-min-size 64mb

# ---- 混合持久化（Redis 4.0+，默认已开启）----
# rewrite 后 AOF 头部存 RDB 快照，追加部分仍为 AOF 格式
aof-use-rdb-preamble yes

# ---- RDB 对照：本实验关掉自动快照，纯验证 AOF 的恢复能力 ----
save ""
